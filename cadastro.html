

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Julia Tech</title>
    <link rel="stylesheet" href="cadastro.css">
</head>
<body>

    <div class="celular">

        <div class="fantasma">
         
        </div>

        <main>
            <h2>Cadastro</h2>
            <p class="texto">Crie sua conta para continuar!</p>

           
            <form id="formulario">

                <label for="nome">Nome completo</label>
                <input type="text" id="nome"
                    placeholder="Digite seu nome" required>

                <label for="email">E-mail</label>
                <input type="email" id="email"
                    placeholder="Digite seu e-mail" required>

                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone"
                    placeholder="(00) 00000-0000">

                <label for="senha">Senha</label>
                <input type="password" id="senha"
                    placeholder="Crie uma senha" minlength="8" required>

                <label for="confirmar">Confirmar senha</label>
                <input type="password" id="confirmar"
                    placeholder="Digite a senha novamente"
                    minlength="8" required>

                <button type="submit">Criar minha conta</button>

            </form>

            

            <a href="index.html" class="voltar">← Voltar para o início</a>
        </main>

        <footer>
            <p>JULIA GUTIERRES © 2026</p>
        </footer>

    </div>

    <script>
        const imagem = document.getElementById("imagem");
        const celular = document.querySelector(".celular");

        imagem.addEventListener("change", function() {
            const arquivo = this.files[0];

            if (arquivo) {
                const leitor = new FileReader();

                leitor.onload = function(e) {
                    celular.style.backgroundImage =
                        "linear-gradient(rgba(8,4,35,0.65), rgba(12,10,55,0.75)), url('" +
                        e.target.result + "')";
                };

                leitor.readAsDataURL(arquivo);
            }
        });

        document.getElementById("formulario").addEventListener("submit", function(event) {
            event.preventDefault();

            const senha = document.getElementById("senha").value;
            const confirmar = document.getElementById("confirmar").value;

            if (senha !== confirmar) {
                alert("As senhas não são iguais!");
            } else {
                alert("Cadastro preenchido com sucesso!");
            }
        });
    </script>

</body>
</html>
